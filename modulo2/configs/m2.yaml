# Configuración del Módulo 2 (clasificación de conducción distractiva).
# Cualquier valor se puede cambiar sin editar este archivo:
#   py run.py particion --set particion.umbral_coseno=0.80
# Rutas relativas = relativas a la carpeta modulo2/.

seed: 42            # semilla global (las 30 corridas usan 0..29)
dispositivo: auto   # auto | cuda | cpu
num_workers: 4      # hilos de carga de imágenes (0 si hay problemas en Windows)

datos:
  # Carpeta donde se descomprimió el conjunto (contiene las 5 carpetas de clase).
  # Ruta FUERA de OneDrive y del repositorio.
  raw_dir: C:/datos/m2_raw
  processed_dir: data/processed
  # Lista de State Farm (Kaggle) con el conductor de cada imagen: registro, sección 9.
  # No se versiona en el repositorio (reglas de la competencia).
  state_farm_lista: C:/datos/driver_imgs_list.csv
  # Fragmento del nombre de carpeta -> clase canónica (se busca sin distinguir mayúsculas)
  alias_clases:
    safe: conduccion_segura
    turn: giro
    text: escribir_telefono
    talk: hablar_telefono
    other: otros

duplicados:
  backbone: resnet18          # red preentrenada (ImageNet) para los embeddings
  img_size: 224
  batch_size: 64
  # Se guardan los pares con coseno CENTRADO >= este valor (no decide nada todavía)
  registro_coseno: 0.60
  # Pares aleatorios para la distribución nula (referencia del umbral)
  muestra_nula: 200000
  # Franjas de coseno centrado que se muestran en la figura de calibración
  franjas_calibracion: [[0.60, 0.65], [0.65, 0.70], [0.70, 0.75], [0.75, 0.80], [0.80, 0.85], [0.85, 0.90], [0.90, 1.01]]

particion:
  # Coseno centrado a partir del cual dos imágenes se consideran de la misma
  # persona o sesión y van al mismo grupo (registro, sección 10).
  umbral_coseno: 0.75
  # Imágenes sin conductor conocido: fotos del mismo origen tomadas con menos de
  # estos minutos entre una y la siguiente forman una misma sesión (mismo grupo).
  sesion_gap_min: 10
  proporcion_validacion: 0.15
  proporcion_prueba: 0.15
  n_intentos: 2000            # órdenes aleatorios de grupos evaluados para equilibrar la partición
  # Protección: ningún grupo puede reunir más de esta fracción de su procedencia.
  # 0.45 porque en las fotos de 2024 dos sesiones se unen por similitud en un grupo
  # de 232 de 647 imágenes (36 %), que queda entero en entrenamiento (registro, 10).
  max_fraccion_grupo: 0.45

preproceso:
  tamano: 224               # lado de la imagen guardada (px)
  geometria: estirar        # estirar | recortar | rellenar (registro, sección 11)
  calidad_jpeg: 90
  carpeta: imagenes         # dentro de data/processed/

baseline:
  backbone: efficientnet_b0 # misma red que se ajustará en transfer learning
  batch_size: 64
  valores_C: [0.0001, 0.0003, 0.001, 0.003, 0.01, 0.03, 0.1, 0.3, 1.0, 3.0, 10.0]
  max_iter: 3000
  bootstrap: 1000           # remuestras del conjunto de prueba para la variabilidad

# Intensidades de aumento de datos (se aplican solo al entrenamiento, en línea).
# El volteo horizontal no cambia la etiqueta porque las clases de State Farm
# «derecha» e «izquierda» están unidas; se prueba solo en la intensidad fuerte.
aumentos:
  leve: &aum_leve {rotacion: 5, brillo_contraste: 0.10, recorte_escala_min: 0.90, volteo_h: 0.0}
  medio: &aum_medio {rotacion: 10, brillo_contraste: 0.25, recorte_escala_min: 0.75, volteo_h: 0.0}
  fuerte: &aum_fuerte {rotacion: 15, brillo_contraste: 0.40, recorte_escala_min: 0.60, volteo_h: 0.5}

# Configuración de una red (la usa `entrenar`; `busqueda` parte de aquí y cambia
# lo definido en su espacio; `semillas` usa la mejor configuración de la búsqueda).
red:
  familia: transfer          # cnn | transfer
  epocas_max: 30
  paciencia: 6               # épocas sin mejorar el F1 macro de validación
  batch_size: 64
  optimizador: adamw         # adamw | sgd
  lr: 0.001
  momento: 0.9               # solo SGD (con Nesterov)
  weight_decay: 0.01
  dropout: 0.3
  precision_mixta: true      # bfloat16 en la GPU
  aumento: *aum_medio
  cnn:
    bloques: 5
    filtros_base: 32
  transfer:
    epocas_cabeza: 2         # épocas iniciales entrenando solo la cabeza
    bloques_descongelados: 4 # últimos bloques de EfficientNet-B0 que se ajustan (0-9)
    factor_lr_base: 0.1      # lr de la base = lr * factor

busqueda:
  semilla: 42
  presupuesto: 16            # configuraciones por familia (presupuesto explícito)
  epocas_max: 12
  paciencia: 4
  espacio:
    cnn:
      _optimizacion:
        - {optimizador: adamw, lr: 0.0003}
        - {optimizador: adamw, lr: 0.001}
        - {optimizador: adamw, lr: 0.003}
        - {optimizador: sgd, lr: 0.01}
        - {optimizador: sgd, lr: 0.03}
      weight_decay: [0.0001, 0.001, 0.01, 0.05]
      dropout: [0.2, 0.4, 0.5]
      cnn/bloques: [4, 5]
      cnn/filtros_base: [16, 32]
      aumento: [*aum_leve, *aum_medio, *aum_fuerte]
    transfer:
      _optimizacion:
        - {optimizador: adamw, lr: 0.0003}
        - {optimizador: adamw, lr: 0.001}
        - {optimizador: adamw, lr: 0.003}
        - {optimizador: sgd, lr: 0.01}
        - {optimizador: sgd, lr: 0.03}
      weight_decay: [0.0001, 0.01, 0.05]
      dropout: [0.2, 0.4]
      transfer/bloques_descongelados: [0, 2, 4, 9]
      transfer/factor_lr_base: [0.05, 0.1, 0.3]
      aumento: [*aum_leve, *aum_medio, *aum_fuerte]

semillas:
  inicio: 0
  n: 30
  verbose: false

salidas:
  figuras: figuras
  resultados: resultados
  modelos: models
